name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias foggy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass foggyweather2026 \
            -keypass foggyweather2026 \
            -dname "CN=Foggy Weather, OU=Weather Team, O=Foggy Weather App, L=San Francisco, ST=CA, C=US"

      - name: Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x lintVitalRelease --stacktrace
          cd ..
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ] && [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/release.keystore -storepass foggyweather2026 -keypass foggyweather2026 android/app/build/outputs/apk/release/app-release-unsigned.apk foggy
            mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk
          fi
          cp android/app/build/outputs/apk/release/app-release.apk Foggy-Weather-v1.0.1.apk
          cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Remove Outdated Debug APK Asset
        run: |
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/696548098" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foggy-Weather-v1.0.1-APK
          path: Foggy-Weather-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update v1.0.0 Release with Signed APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Foggy Weather v1.0.0 (APK)"
          body: |
            ## 🌫️ Foggy Weather Android Release APK v1.0.0
            
            Download `Foggy-Weather-v1.0.1.apk` or `app-release.apk` below and install directly on your Android device.
            - **Google Play Protect Compliant:** Signed release build with explicit cleartext-disabled Network Security Policy & strict backup rules.
            - **Latest Updates:** 10-search quota modal, masked key privacy, buttery smooth animations & touch scrolling.
            - **Live Web App:** https://harrykalsi24.github.io/Foggy-Weather/
          files: |
            Foggy-Weather-v1.0.1.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish v1.0.1 Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "Foggy Weather v1.0.1 (Latest Release)"
          make_latest: true
          body: |
            ## 🌫️ Foggy Weather Android Release APK v1.0.1 (Latest)
            
            Download `Foggy-Weather-v1.0.1.apk` below and install directly on your Android device.
            - **Google Play Protect Compliant:** Signed release build with explicit cleartext-disabled Network Security Policy & strict backup rules.
            - **Latest Updates:** 10-search quota modal, masked key privacy, buttery smooth animations & touch scrolling.
            - **Live Web App:** https://harrykalsi24.github.io/Foggy-Weather/
          files: |
            Foggy-Weather-v1.0.1.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
